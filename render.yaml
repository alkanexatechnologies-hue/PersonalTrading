services:
  - type: web
    name: nsa-intraday-assistant
    runtime: node
    # PERSISTENCE: a Persistent Disk (below) is REQUIRED for admin-created user
    # accounts to survive restart/redeploy, and Render only allows disks on a
    # paid plan. The free tier has an EPHEMERAL filesystem - on the free tier the
    # admin login can still be pinned via LOGIN_USER/LOGIN_PASS env vars, but
    # users.json (created users) cannot persist without the disk.
    plan: starter
    autoDeploy: true
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /health
    # Persistent Disk: keeps the auth/login data (admin credentials,
    # admin-created users, login audit) across restarts, redeploys and GitHub
    # deploys. DATA_DIR (below) points the auth stores at this mount. A deploy
    # NEVER recreates or wipes this disk - it is separate from the code checkout.
    disk:
      name: nsa-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: NODE_VERSION
        value: 22.19.0
      # --- Persistent data location: auth credentials, users and login audit
      # are written here. Must match the disk mountPath above so they land on
      # the Persistent Disk instead of the ephemeral container filesystem. ---
      - key: DATA_DIR
        value: /var/data
      # --- Required for real login (otherwise a random password is generated
      # on every restart and only visible in the Render log). Setting these
      # pins a stable admin login that survives restarts even without the disk. ---
      - key: LOGIN_USER
        sync: false
      - key: LOGIN_PASS
        sync: false
      # --- Live market data / broker tokens ---
      # These are a DURABLE FALLBACK that survives restarts/redeploys: on the
      # ephemeral free-tier filesystem the UI-saved token file is wiped on a
      # restart, so seeding the token here keeps the app connected without
      # re-pasting. Precedence is "UI-saved token WINS, env var is the fallback"
      # (see dhanConfig.ts / growwConfig.ts) — so pasting a fresh token in the UI
      # always takes effect, and the env var only fills in when no saved token
      # exists (e.g. right after a restart). NOTE: Dhan (~24h) and Groww (~daily)
      # tokens EXPIRE, so whichever store you use must be refreshed daily —
      # either re-paste in the UI (persists if a disk is mounted) or update the
      # env var value here (triggers a redeploy). DHAN_CLIENT_ID is auto-derived
      # from the token's JWT on a UI save; set it here only when seeding by env.
      - key: GROWW_ACCESS_TOKEN
        sync: false
      - key: DHAN_ACCESS_TOKEN
        sync: false
      - key: DHAN_CLIENT_ID
        sync: false
      # --- Alerts / notifications (optional) ---
      - key: SMTP_HOST
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      # --- AI narration (optional) ---
      - key: ANTHROPIC_API_KEY
        sync: false
      # --- Safety switches: must stay off in production per project rules ---
      - key: LIVE_ORDER_EXECUTION
        value: "false"
      - key: MODEL_TRAINING_ENABLED
        value: "false"
